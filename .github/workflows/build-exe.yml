name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["work", "main", "master"]

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependency
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name CrazyWheel wheel_app.py

      - name: Zip executable
        shell: pwsh
        run: |
          Compress-Archive -Path dist/CrazyWheel.exe -DestinationPath dist/CrazyWheel-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrazyWheel-windows-exe
          path: dist/CrazyWheel-windows.zip
